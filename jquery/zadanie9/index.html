<!DOCTYPE html>
<html lang="en">
<head>

    <style>
    #kwadrat { width: 150px; height: 150px; background: lightgray; }
  </style>

  <style>
    #jablko { width: 30px; height: 30px; background: red; }
  </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
    $(function(){
        let x = 0;
        let y = 0;
        let speed = 10;


        let jablkoX = Math.floor((Math.random() * 500) + 1);
        let jablkoY = Math.floor((Math.random() * 500) + 1);

        $("jablko").css({
            "margin-left": jablkoX + "px",
            "margin-top": jablkoY + "px"
        });









        $(document).on("keydown keyup keypress", function(){
            $('#eventType').text(event.type);
        });

        $(document).on("mousemove", function(){
            $('#pageX').text(event.pageX);
            $('#pageY').text(event.pageY);
        });

         $(document).on("keypress", function(){
            if(event.key == "="){
                speed+=10;
            }
            else if(event.key == "-"){
                speed-=10;
            }    
            
        });

        $(document).on("keydown", function(){
            if(event.key == "d" || event.key == "ArrowRight"){
                x+=speed;
                $('#kwadrat').css("margin-left", x);
                
            }
            else if(event.key == "a" || event.key == "ArrowLeft"){
                x-=speed;
                $('#kwadrat').css("margin-left", x);
            }
             else if(event.key == "w" || event.key == "ArrowUp"){
                y-=speed;
                $('#kwadrat').css("margin-top", y);
            }
            else if(event.key == "s" || event.key == "ArrowDown"){
                y+=speed;
                $('#kwadrat').css("margin-top", y);
            }
            
        });

        
        
    });
    </script>
</head>
<body>
      <input type="text" id="pole">

      <p>Typ zdarzenia
        <span id="eventType">----</span>
      </p>

      <p>
        Pozycja myszy:
        x = <span id="pageX">----</span>
        y = <span id="pageY">----</span>
      </p>

      <div id="kwadrat"></div>
      <div id="jablko"></div>
 
</body>
</html>
