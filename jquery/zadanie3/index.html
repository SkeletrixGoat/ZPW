<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    #kwadrat { width: 150px; height: 150px; background: lightgray; }
  </style>




    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
    $(function(){
        
        //$("#przywitaj").on("click", function(){
         //   console.log("Testujemy przycisk");
        //})

        // let $imie = (prompt("Cześć! Jak masz na imię?"));
        // $("#komunikat").text("Cześć, " + $imie + "!");
        
        $("#przywitaj").click(function(){
            $("#komunikat").text("Cześć!");
            
            
        })

         $("#kwadrat").click(function(){
            $("#kwadrat").css("background-color", "red");
            
            
        })

        $("#reset").click(function(){
            $("#komunikat").text("");
            $("#kwadrat").css("background-color", "lightGray");
            
            
        })


        
    });
    </script>
</head>
<body>
      <button id="przywitaj">Przywitaj się</button>
  <p id="komunikat"></p>
 
  <div id="kwadrat"></div>
  <button id="reset">Resetuj kolor</button>
 
</body>
</html>
